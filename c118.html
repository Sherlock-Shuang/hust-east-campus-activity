<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>光电信息大楼 · C118 报告厅</title></head>
<body><canvas id="hall-canvas" tabindex="0" aria-label="C118 报告厅，可步行探索"></canvas>
<header><div><span>光电信息大楼</span><h1>C118 报告厅</h1></div><a id="hall-return" href="./">返回校园</a></header>
<aside id="hall-input-hint" aria-label="室内操作提示">WASD 移动 · E 入座 · 鼠标环视 · L 锁定<br>手机：左侧任意位置移动，右侧滑动环视</aside>
<div id="hall-status" role="status">正在准备报告厅…</div><div id="hall-stick" hidden><i></i></div>
<section id="hall-screen-controls" aria-label="C118 大屏播放控制">
<div><strong id="screen-title">Vibe Coding 成果展示</strong><span id="screen-time">0:00 / 1:52</span></div>
<button id="screen-codex-open" type="button" hidden>回复大屏</button><button id="screen-codex-new" type="button" hidden>新聊天</button>
<p id="screen-program-note">主持人统一选片</p>
<p id="screen-status" role="status">面向大屏时自动播放</p>
<nav aria-label="视频控制"><button id="screen-play" type="button">暂停</button><button id="screen-sound" type="button" aria-pressed="false">开启声音</button><button id="screen-restart" type="button">从头播放</button></nav>
</section>
<section id="hall-seating-controls" aria-label="报告厅入座">
<p id="seat-status" role="status">入座，欣赏舞台与大屏</p>
<div><button id="seat-enter" type="button">入座看大屏</button><button id="seat-face" type="button" hidden>看大屏</button><button id="seat-look" type="button" hidden>环视报告厅</button><button id="seat-rise" type="button" hidden>起身</button></div>
</section>
<section id="hall-swim-controls" aria-label="游泳控制" hidden><span id="swim-depth" role="status">水面</span><button id="swim-up" type="button" aria-label="按住上浮">↑ 上浮</button><button id="swim-down" type="button" aria-label="按住下潜">↓ 下潜</button><button id="swim-exit" type="button">离开报告厅 ↗</button></section>
<div id="hall-pause" hidden>活动暂时暂停，请留意主持人公告</div>
<div id="hall-flood-status" hidden><strong></strong><small>点击画面开启音效 · WASD 移动</small></div>
<footer>依据现场照片重建 · 空间尺寸与座席排布为估计</footer>
<script src="./experiences/activity-bridge.js" data-work="opto-c118"></script><script type="module" src="./src/c118-viewer.js"></script></body></html>
