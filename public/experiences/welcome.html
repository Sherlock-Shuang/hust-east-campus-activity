<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>光点收集 · 入口联动示例</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef4ef;font-family:system-ui,-apple-system,'PingFang SC',sans-serif;color:#1d493d;min-height:100dvh;display:grid;place-items:center}.experience{width:min(800px,100%);padding:30px}header{display:flex;justify-content:space-between;align-items:end;gap:20px}h1{font-size:28px;font-weight:600;margin:6px 0 10px}p{color:#547669;font-size:13px;line-height:1.8;margin:0}small{color:#628576;font-size:11px}#score{font-size:36px;line-height:1;font-weight:500}#field{height:clamp(220px,48vh,430px);position:relative;border-radius:20px;background:#dbe9df;border:1px solid #b8d0c0;overflow:hidden;margin:25px 0}#field::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,#f2f9f180,transparent 65%)}.spark{position:absolute;border:1px solid #d4fff3;border-radius:50%;width:32px;height:32px;transform:translate(-50%,-50%);background:#477f69;box-shadow:0 0 0 9px #71b79320,0 0 35px #4f996768;cursor:pointer;transition:background .15s}.spark:hover{background:#1e5b47}.spark:focus-visible{outline:3px solid #173f31;outline-offset:12px}footer{display:flex;gap:20px;justify-content:space-between;align-items:center}#return{background:transparent;border:1px solid #9abcaa;color:inherit;font:inherit;padding:10px 16px;border-radius:10px;cursor:pointer}#status{font-size:12px;color:#5f7d70}@media(max-width:500px){.experience{padding:18px}h1{font-size:24px}}
</style></head><body><main class="experience"><header><div><small>校园里的一个小体验</small><h1>把光留在手心</h1><p>点击漂浮的光点，看看你能收集多少。</p></div><div><strong id="score">0</strong><p>枚光点</p></div></header><div id="field" aria-label="收集光点"></div><footer><span id="status">已接入校园活动控制</span><button id="return">返回校园</button></footer></main><script src="./activity-bridge.js"></script><script>
const field=document.getElementById('field'),score=document.getElementById('score');let collected=0,paused=false,elapsed=0,last=performance.now();const sparks=[];
for(let i=0;i<7;i++){const button=document.createElement('button');button.className='spark';button.setAttribute('aria-label','收集光点');const item={button,x:12+Math.random()*76,y:18+Math.random()*64,phase:Math.random()*6};button.addEventListener('click',()=>{if(paused)return;score.textContent=String(++collected);item.x=12+Math.random()*76;item.y=18+Math.random()*64;});field.append(button);sparks.push(item);}
window.campusActivity.subscribe(state=>{paused=state.paused;field.inert=paused;document.getElementById('status').textContent=paused?'活动暂停中':'已接入校园活动控制';});
document.getElementById('return').addEventListener('click',()=>window.campusActivity.exit());
function animate(now){const dt=Math.min((now-last)/1000,.05);last=now;if(!paused&&!document.hidden){elapsed+=dt;for(const item of sparks){item.button.style.left=item.x+'%';item.button.style.top=(item.y+Math.sin(elapsed+item.phase)*5)+'%';}}requestAnimationFrame(animate);}requestAnimationFrame(animate);
</script></body></html>
